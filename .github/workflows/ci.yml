name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # prefill-recovery.test.ts exercises BullMQ + progress Redis; without this
    # the suite fails with ECONNREFUSED rather than asserting anything useful.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      JWT_SECRET: ci-jwt-secret-must-be-long-enough-for-hs256
      ENCRYPTION_KEY: "12345678901234567890123456789012"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      REDIS_URL: redis://127.0.0.1:6379
      # Do not set NODE_ENV=production here — npm ci would skip devDependencies
      # and Next.js could not load next.config.ts (needs typescript).

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Wait for Redis
        run: |
          node -e "
          const Redis = require('ioredis');
          const url = process.env.REDIS_URL || 'redis://127.0.0.1:6379';
          (async () => {
            for (let i = 1; i <= 30; i++) {
              const r = new Redis(url, {
                maxRetriesPerRequest: 1,
                connectTimeout: 1000,
                lazyConnect: true,
                enableOfflineQueue: false,
                retryStrategy: () => null,
              });
              r.on('error', () => {});
              try {
                await r.connect();
                const pong = await r.ping();
                await r.quit();
                if (pong === 'PONG') {
                  console.log('Redis is up at', url);
                  process.exit(0);
                }
              } catch (err) {
                await r.quit().catch(() => {});
                console.log('waiting for Redis… (' + i + ') ' + err.message);
                await new Promise((res) => setTimeout(res, 1000));
              }
            }
            console.error('Redis did not become ready in time at', url);
            process.exit(1);
          })();
          "

      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
