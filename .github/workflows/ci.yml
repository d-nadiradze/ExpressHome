name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # prefill-recovery.test.ts exercises BullMQ + progress Redis; without this
    # the suite fails with ECONNREFUSED rather than asserting anything useful.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      JWT_SECRET: ci-jwt-secret-must-be-long-enough-for-hs256
      ENCRYPTION_KEY: "12345678901234567890123456789012"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      REDIS_URL: redis://127.0.0.1:6379
      # Do not set NODE_ENV=production here — npm ci would skip devDependencies
      # and Next.js could not load next.config.ts (needs typescript).

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
